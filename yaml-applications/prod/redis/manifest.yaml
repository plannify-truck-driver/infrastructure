apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: plannify-2
  labels:
    app.kubernetes.io/instance: redis
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: edis
    app.kubernetes.io/version: 8.8.0
    helm.sh/chart: redis-0.30.6
data:
  redis.conf: |
    # Redis configuration
    bind * -::*
    
