apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-restrict-access
  namespace: plannify-2
spec:
  podSelector:
    matchLabels:
      role: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plannify-2
          podSelector:
            matchLabels:
              role: backend
      ports:
        - protocol: TCP
          port: 5432
