apiVersion: v1
kind: ConfigMap
metadata:
  name: workday-migration-script
  namespace: plannify-2
data:
  migrate.py: |
    import logging
    import os
    import sys
    from typing import Any

    import psycopg2
    import psycopg2.errors
    import psycopg2.extras

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [%(levelname)s] %(message)s",
        handlers=[logging.StreamHandler(sys.stdout)],
    )
    log = logging.getLogger(__name__)

    BATCH_SIZE = int(os.environ.get("BATCH_SIZE", "500"))

    # ── workday ──────────────────────────────────────────────────────────────────

    FETCH_WORKDAY_SQL = """
        SELECT
            fk_user_id::uuid                              AS fk_driver_id,
            date::date                                     AS date,
            (start::time + interval '2 hours')::time      AS start_time,
            ("end"::time + interval '2 hours')::time      AS end_time,
            (rest::time + interval '2 hours')::time       AS rest_time,
            overnight_rest
        FROM public.workday
        ORDER BY date, fk_user_id
    """

    UPSERT_WORKDAY_SQL = """
        INSERT INTO public.workdays
            (date, fk_driver_id, start_time, end_time, rest_time, overnight_rest)
        VALUES
            (%(date)s, %(fk_driver_id)s, %(start_time)s, %(end_time)s, %(rest_time)s, %(overnight_rest)s)
        ON CONFLICT (date, fk_driver_id) DO NOTHING
    """

    # ── workday_garbage ───────────────────────────────────────────────────────────

    FETCH_GARBAGE_SQL = """
        SELECT
            fk_user_id::uuid        AS fk_driver_id,
            workday_date            AS workday_date,
            created_at              AS created_at,
            scheduled_deletion_date AS scheduled_deletion_date
        FROM public.workday_garbage
        ORDER BY workday_date, fk_user_id
    """

    UPSERT_GARBAGE_SQL = """
        INSERT INTO public.workday_garbage
            (workday_date, fk_driver_id, created_at, scheduled_deletion_date)
        VALUES
            (%(workday_date)s, %(fk_driver_id)s, %(created_at)s, %(scheduled_deletion_date)s)
        ON CONFLICT (workday_date, fk_driver_id) DO NOTHING
    """


    # ── batch logic ───────────────────────────────────────────────────────────────

    def upsert_batch(
        cur_b: Any,
        upsert_sql: str,
        rows: list[dict[str, Any]],
        label: str,
    ) -> tuple[int, int]:
        """
        Upsert a batch into DB B.
        Falls back to row-by-row on failure so bad rows are skipped
        without losing the rest of the batch.
        Returns (upserted, skipped).
        """
        try:
            psycopg2.extras.execute_batch(cur_b, upsert_sql, rows, page_size=len(rows))
            return len(rows), 0
        except Exception:
            cur_b.execute("ROLLBACK TO SAVEPOINT batch")
            ok = skipped = 0
            for row in rows:
                try:
                    cur_b.execute("SAVEPOINT row")
                    cur_b.execute(upsert_sql, row)
                    ok += 1
                except psycopg2.errors.ForeignKeyViolation:
                    cur_b.execute("ROLLBACK TO SAVEPOINT row")
                    log.warning(
                        "[%s] Skipped: FK violation for driver %s (date=%s)",
                        label,
                        row.get("fk_driver_id"),
                        row.get("date") or row.get("workday_date"),
                    )
                    skipped += 1
                except Exception as exc:
                    cur_b.execute("ROLLBACK TO SAVEPOINT row")
                    log.error(
                        "[%s] Skipped: unexpected error for driver %s (date=%s) — %s",
                        label,
                        row.get("fk_driver_id"),
                        row.get("date") or row.get("workday_date"),
                        exc,
                    )
                    skipped += 1
            return ok, skipped


    def migrate_table(
        conn_a: Any,
        conn_b: Any,
        fetch_sql: str,
        upsert_sql: str,
        cursor_name: str,
        label: str,
    ) -> None:
        total_ok = total_skipped = total_rows = 0

        with conn_a.cursor(name=cursor_name, cursor_factory=psycopg2.extras.RealDictCursor) as cur_a, \
             conn_b.cursor() as cur_b:

            cur_a.itersize = BATCH_SIZE
            cur_a.execute(fetch_sql)

            log.info("[%s] Streaming rows in batches of %d…", label, BATCH_SIZE)

            while True:
                rows = cur_a.fetchmany(BATCH_SIZE)
                if not rows:
                    break

                total_rows += len(rows)
                cur_b.execute("SAVEPOINT batch")
                ok, skipped = upsert_batch(cur_b, upsert_sql, [dict(r) for r in rows], label)
                conn_b.commit()

                total_ok += ok
                total_skipped += skipped
                log.info(
                    "[%s] Progress — %d rows processed (batch: %d ok, %d skipped)",
                    label,
                    total_rows,
                    ok,
                    skipped,
                )

        log.info(
            "[%s] Done — %d rows processed → %d upserted, %d skipped.",
            label,
            total_rows,
            total_ok,
            total_skipped,
        )


    # ── entry point ───────────────────────────────────────────────────────────────

    def migrate(db_a_url: str, db_b_url: str) -> None:
        log.info("Connecting to databases…")
        conn_a = psycopg2.connect(db_a_url)
        conn_b = psycopg2.connect(db_b_url)
        conn_a.set_session(readonly=True)

        try:
            # workday_garbage has a FK on workdays → migrate workdays first.
            migrate_table(conn_a, conn_b, FETCH_WORKDAY_SQL,  UPSERT_WORKDAY_SQL,  "workday_cursor",  "workdays")
            migrate_table(conn_a, conn_b, FETCH_GARBAGE_SQL,  UPSERT_GARBAGE_SQL,  "garbage_cursor",  "workday_garbage")
        finally:
            conn_a.close()
            conn_b.close()


    if __name__ == "__main__":
        db_a = os.environ.get("DB_A_URL")
        db_b = os.environ.get("DB_B_URL")

        if not db_a or not db_b:
            log.error("DB_A_URL and DB_B_URL environment variables are required.")
            sys.exit(1)

        migrate(db_a, db_b)
