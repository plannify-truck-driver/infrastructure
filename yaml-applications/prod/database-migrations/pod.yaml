apiVersion: v1
kind: Pod
metadata:
  name: database-migrations
  namespace: plannify-2
spec:
  containers:
    - name: database-migrations
      image: ghcr.io/plannify-truck-driver/common-services:0.1.17
      imagePullPolicy: Always
      resources:
        requests:
          cpu: "20m"
          memory: "32Mi"
        limits:
          cpu: "20m"
          memory: "32Mi"
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: DATABASE_URL
  restartPolicy: Never
  imagePullSecrets:
    - name: ghcr-secret
