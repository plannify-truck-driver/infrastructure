apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-ui
  namespace: plannify-2
  labels:
    helm.sh/chart: garage-ui-0.2.5
    app.kubernetes.io/name: garage-ui
    app.kubernetes.io/instance: garage-ui
    app.kubernetes.io/version: "v0.4.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-ui
      app.kubernetes.io/instance: garage-ui
  template:
    metadata:
      annotations:
        checksum/config: 3f76db3c98c56b6913b45b5de800e3df57a10fbf633c371c6b5391ce994b65b2
      labels:
        app.kubernetes.io/name: garage-ui
        app.kubernetes.io/instance: garage-ui
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: garage-ui
        securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
        image: "noooste/garage-ui:v0.4.2"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: GARAGE_UI_GARAGE_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: garage-ui-secrets
              key: ADMIN_TOKEN
        - name: GARAGE_UI_AUTH_JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: garage-ui-jwt-key
              key: jwt-key.pem
        - name: GARAGE_UI_AUTH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: garage-ui-secrets
              key: ADMIN_PASSWORD
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: garage-ui-config
