apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-driver-app
  namespace: plannify-2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-driver-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
