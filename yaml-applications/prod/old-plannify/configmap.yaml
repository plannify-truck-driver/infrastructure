apiVersion: v1
kind: ConfigMap
metadata:
  name: old-plannify-html
  namespace: plannify-2
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Plannify — Version indisponible</title>
        <style>
          :root {
            --bg: #0f172a;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --accent: rgb(80, 108, 237);
            --accent-hover: rgb(64, 87, 210);
          }
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%);
            font-family:
              -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
          }
          .card {
            background: var(--card);
            color: var(--text);
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
          }
          .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(80, 108, 237, 0.12);
            border-radius: 50%;
          }
          .icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent);
          }
          h1 {
            font-size: 22px;
            margin: 0 0 12px;
          }
          p {
            color: var(--muted);
            line-height: 1.6;
            margin: 0 0 28px;
            font-size: 15px;
          }
          a.button {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 10px;
            transition: background 0.2s ease;
          }
          a.button:hover {
            background: var(--accent-hover);
          }
        </style>
      </head>
      <body>
        <div class="card">
          <div class="icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <h1>Cette version de Plannify n'est plus disponible</h1>
          <p>
            Plannify a évolué. Cette ancienne version a été remplacée par une
            nouvelle plateforme, rendez-vous sur la nouvelle adresse pour continuer
            à utiliser l'application.
          </p>
          <a class="button" href="https://driver.plannify.be"
            >Aller sur la nouvelle version</a
          >
        </div>
      </body>
    </html>
