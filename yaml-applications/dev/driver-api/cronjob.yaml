apiVersion: batch/v1
kind: CronJob
metadata:
  name: plannify-driver-delete-garbage
  namespace: plannify-dev
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            role: backend
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: ghcr.io/plannify-truck-driver/driver-job:0aaab683edd3c31c9cf592a4aad9b291d9a2738a
              args: ["delete-garbage"]
              resources:
                requests:
                  cpu: "40m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: dev-database-secrets
                      key: DATABASE_URL
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: dev-database-secrets
                      key: REDIS_URL
                - name: FRONTEND_URL
                  value: "https://driver-dev.plannify.be"
                - name: PDF_SERVICE_ENDPOINT
                  value: "http://plannify-pdf-service:3000"
                - name: SMTP_DEFAULT_SENDER
                  valueFrom:
                    secretKeyRef:
                      name: dev-smtp-secrets
                      key: SMTP_DEFAULT_SENDER
                - name: SMTP_DEFAULT_SENDER_REPLY_TO
                  valueFrom:
                    secretKeyRef:
                      name: dev-smtp-secrets
                      key: SMTP_DEFAULT_SENDER_REPLY_TO
                - name: SMTP_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: dev-smtp-secrets
                      key: SMTP_USERNAME
                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dev-smtp-secrets
                      key: SMTP_PASSWORD
                - name: SMTP_DOMAIN
                  valueFrom:
                    secretKeyRef:
                      name: dev-smtp-secrets
                      key: SMTP_DOMAIN
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: plannify-dev-garage
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: plannify-dev-garage
                      key: S3_SECRET_KEY
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: plannify-dev-garage
                      key: S3_BUCKET_NAME
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: plannify-dev-garage
                      key: S3_ENDPOINT
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: plannify-dev-garage
                      key: S3_REGION
                - name: UPTIME_URL
                  valueFrom:
                    secretKeyRef:
                      name: dev-uptime-urls
                      key: DELETE_GARBAGE
          imagePullSecrets:
            - name: ghcr-secret
---
