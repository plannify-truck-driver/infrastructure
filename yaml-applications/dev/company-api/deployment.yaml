apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: company-api
  name: company-api
  namespace: plannify-dev
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: company-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: company-api
        role: backend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: company-api
          image: ghcr.io/plannify-truck-driver/company-api:73c5609fe3a489b7dd2dba30229e0cb9af87c80d
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
          ports:
            - containerPort: 3000
              protocol: TCP
            - containerPort: 3001
              protocol: TCP
          # startupProbe:
          #   httpGet:
          #     path: /health
          #     port: 3001
          #   failureThreshold: 30
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3001
          #   failureThreshold: 3
          #   initialDelaySeconds: 10
          #   periodSeconds: 20
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3001
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: RUST_LOG
              value: INFO
            - name: ENVIRONMENT
              value: development
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
